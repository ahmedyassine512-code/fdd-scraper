name: Scrape Wisconsin DFI FDDs

on:
  workflow_dispatch: {}   # manual "Run workflow" button in the Actions tab

permissions:
  contents: write   # needed so the debug-output push step below can push to the repo

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90    # alphabet enumeration + per-filing PDF pulls, generously bounded
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        id: run_scraper
        continue-on-error: true
        run: |
          python scrape_wi_fdd.py 2>&1 | tee scraper_output.log
          echo "${PIPESTATUS[0]}" > scraper_exit_code.txt
          exit "$(cat scraper_exit_code.txt)"

      - name: Run extraction
        id: run_extraction
        if: steps.run_scraper.outcome == 'success'
        continue-on-error: true
        run: |
          python extract_item20_insurance.py 2>&1 | tee -a scraper_output.log
          echo "${PIPESTATUS[0]}" >> scraper_exit_code.txt

      - name: Commit debug output to repo (readable outside Actions artifact storage)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B debug-output

          for f in scraper_output.log scraper_exit_code.txt list.csv raw_extract.csv \
                   debug_search_page.html debug_results_page.html debug_detail_page.html; do
            if [ -e "$f" ]; then
              git add -f "$f"
              echo "added: $f"
            else
              echo "missing (not created this run): $f"
            fi
          done
          if [ -d fdds ] && [ "$(ls -A fdds 2>/dev/null)" ]; then
            git add -f fdds/
            echo "added: fdds/"
          fi

          git commit -m "Automated debug output from run ${{ github.run_id }}" || echo "nothing to commit"
          git push -f origin debug-output

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wi-fdd-results
          path: |
            list.csv
            raw_extract.csv
            fdds/
            debug_search_page.html
            debug_results_page.html
            debug_detail_page.html
            scraper_output.log
          if-no-files-found: warn
          retention-days: 14

      - name: Fail job if scraper actually failed
        if: steps.run_scraper.outcome == 'failure'
        run: exit 1
